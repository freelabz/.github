name: publish-canary (reusable)

# ORG REUSABLE WORKFLOW (freelabz/.github). Builds the :canary image via Cloud Build, then
# ROLLS the canary Deployment so the fresh image is actually served (publish alone only puts
# the image in the registry; running pods don't restart on their own).
#
# GENERIC by design: every platform value (cluster/project/namespace/deployment) is an INPUT
# supplied by the PRIVATE caller — nothing platform-specific is hardcoded here. NOT used by
# secator core (public, Docker Hub, no env-canary). See gke-admin docs/branch-pr-canary-workflow.md.
#
# PREREQ: the SA behind GCP_CREDENTIALS needs roles/container.developer on the cluster, else
# the roll step fails. Do NOT adopt this in a repo before that grant exists.

on:
  workflow_call:
    inputs:
      cluster:           { required: true,  type: string }
      location:          { required: true,  type: string }
      project:           { required: true,  type: string }
      namespace:         { required: true,  type: string }
      deployment_prefix: { required: true,  type: string }
      submodules:        { required: false, type: string, default: 'false' }
    secrets:
      GCP_CREDENTIALS: { required: true }
      CHECKOUT_TOKEN:  { required: false }

permissions:
  contents: read

concurrency:
  group: publish-canary-${{ github.repository }}
  cancel-in-progress: true

jobs:
  publish-and-roll:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: ${{ inputs.submodules }}
          token: ${{ secrets.CHECKOUT_TOKEN || github.token }}

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ inputs.location }}-docker.pkg.dev

      - name: Build & push :canary image
        run: gcloud builds submit --substitutions=_VERSION=canary .

      - name: Roll the canary deployment (serve the fresh image)
        run: |
          gcloud components install gke-gcloud-auth-plugin kubectl --quiet || true
          gcloud container clusters get-credentials "${{ inputs.cluster }}" \
            --region "${{ inputs.location }}" --project "${{ inputs.project }}"
          NS="${{ inputs.namespace }}"
          PREFIX="${{ inputs.deployment_prefix }}"
          # Deployments may be pulumi-auto-named (hash suffix) and carry no app label → resolve
          # by name prefix (plain name OR <prefix>-<hex>).
          DEPLOY=$(kubectl get deploy -n "$NS" -o name | grep -E "/${PREFIX}(-[a-f0-9]+)?$" | head -1)
          if [ -z "$DEPLOY" ]; then echo "::error::no deployment matching '${PREFIX}' in ${NS}"; exit 1; fi
          echo "Rolling $DEPLOY in $NS"
          kubectl rollout restart "$DEPLOY" -n "$NS"
          kubectl rollout status  "$DEPLOY" -n "$NS" --timeout=180s
